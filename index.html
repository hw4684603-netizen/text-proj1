<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>王欣南 - 个人简历</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-rows: 52px minmax(0, 1fr);
      color: #202124;
      background: #e9ecef;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 20px;
      background: #fff;
      border-bottom: 1px solid #d9dee3;
    }
    .download {
      color: #075985;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .download:hover { text-decoration: underline; }
    main { min-height: 0; }
    object {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #dfe3e7;
    }
    .fallback { padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <a class="download" href="./resume.pdf" download="王欣南-个人简历.pdf">下载 PDF</a>
  </header>
  <main>
    <object data="./resume.pdf" type="application/pdf" aria-label="王欣南的个人简历 PDF">
      <p class="fallback">当前浏览器无法预览 PDF，请<a href="./resume.pdf" download="王欣南-个人简历.pdf">下载简历</a>。</p>
    </object>
  </main>
</body>
</html>
